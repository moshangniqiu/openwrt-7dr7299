name: OpenWrt-Enterprise-Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 */3 * *'

permissions: write-all

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  REPO_BRANCH: mt798x-mt799x-6.6-mtwifi

  TZ: Asia/Shanghai

  CC: clang
  CXX: clang++
  CLANG: /usr/bin/clang

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # =========================
    # 🧹 清理空间
    # =========================
    - name: Free Disk
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true

    # =========================
    # ⚙️ 安装工具链（企业级固定）
    # =========================
    - name: Install Toolchain
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          clang-14 llvm-14 lld-14 \
          gcc g++ make git curl wget unzip file \
          python3 flex bison \
          libncurses5-dev libncursesw5-dev \
          libssl-dev libelf-dev zlib1g-dev

        # 固定 clang
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-14 100
        sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-14 100

        sudo update-alternatives --set clang /usr/bin/clang-14
        sudo update-alternatives --set clang++ /usr/bin/clang++-14

        clang --version

    # =========================
    # 📦 缓存（企业核心）
    # =========================
    - name: Cache Toolchain
      uses: actions/cache@v4
      with:
        path: |
          openwrt/staging_dir
          openwrt/build_dir
          openwrt/dl
        key: openwrt-${{ runner.os }}-${{ hashFiles('**/.config') }}
        restore-keys: |
          openwrt-${{ runner.os }}-

    # =========================
    # 📥 拉源码
    # =========================
    - name: Clone OpenWrt
      run: |
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        echo "OPENWRT_PATH=$PWD/openwrt" >> $GITHUB_ENV

    # =========================
    # 📦 feeds（拆分优化）
    # =========================
    - name: Feeds Update
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # =========================
    # ⚙️ config 清洗（关键）
    # =========================
    - name: Load & Clean Config
      run: |
        cd $OPENWRT_PATH

        # 你的配置文件
        [ -f ../configs/6.6.txt ] && cp ../configs/6.6.txt .config
        [ -f ../configs/CUSTOMIZE.txt ] && cat ../configs/CUSTOMIZE.txt >> .config

        # 🧨 企业级清理：彻底防 /invalid/clang
        sed -i '/CLANG/d' .config || true
        sed -i '/LLVM/d' .config || true
        sed -i '/CONFIG_CC/d' .config || true
        sed -i '/CONFIG_CXX/d' .config || true

        # 防止 bpf 探测污染
        sed -i '/clang/d' .config || true

        make defconfig

    # =========================
    # 📥 dl 下载
    # =========================
    - name: Download Sources
      run: |
        cd $OPENWRT_PATH
        make download -j8

    # =========================
    # 🔥 编译（企业级稳定模式）
    # =========================
    - name: Build Firmware (Enterprise)
      id: build
      env:
        CC: clang
        CXX: clang++
        CLANG: /usr/bin/clang
      run: |
        cd $OPENWRT_PATH

        echo "=== TOOLCHAIN CHECK ==="
        which clang
        clang --version

        echo "=== START BUILD ==="

        # 🚨 第一轮（快速）
        make -j$(nproc)

        # 🚨 如果失败 → fallback 单线程（稳定模式）
        if [ $? -ne 0 ]; then
          echo "FAST BUILD FAILED → fallback single thread"
          make -j1 V=s
        fi

        echo "status=success" >> $GITHUB_OUTPUT

    # =========================
    # 📦 产物上传
    # =========================
    - name: Upload Firmware
      if: steps.build.outputs.status == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-Firmware-Enterprise
        path: openwrt/bin
