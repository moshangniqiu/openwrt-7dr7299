name: Build-6.6

on:
  workflow_dispatch:
    inputs:
      clean_toolchain:
        description: '清理缓存工具链'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  schedule:
    - cron: '0 18 */3 * *'

permissions: write-all

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  REPO_BRANCH: mt798x-mt799x-6.6-mtwifi
  CONFIG_BASE: configs/6.6.txt
  CONFIG_CUSTOM: configs/CUSTOMIZE.txt
  DIY_SCRIPT: scripts/diy-script.sh
  DIY_SCRIPT_2: scripts/diy-6.6.sh
  CACHE_TOOLCHAIN: false
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: TL-7DR7299-v1
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies & LLVM 14 (Fix BPF clang missing)
        run: |
          sudo apt-get update
          sudo apt install -y build-essential flex bison gawk gcc-multilib git curl unzip python3 file rsync libncurses5-dev libncursesw5-dev zlib1g-dev wget software-properties-common
          # 官方llvm一键安装脚本
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 14 all
          # 全局软链接统一clang命令
          sudo ln -sf /usr/bin/clang-14 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-14 /usr/bin/clang++
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/bin/llvm-strip
          sudo ln -sf /usr/bin/llc-14 /usr/bin/llc
          # 打印校验日志
          echo "=== Clang Info ==="
          which clang
          clang --version
          llc --version

      - name: Checkout workflow repo
        uses: actions/checkout@v5

      - name: Clone ImmortalWrt source
        run: |
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
          cd openwrt
          echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

      - name: Update & Install feeds
        run: |
          cd $OPENWRT_PATH
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Merge custom config & diy script
        run: |
          [ -e $CONFIG_BASE ] && cat $CONFIG_BASE > $OPENWRT_PATH/.config
          [ -e $CONFIG_CUSTOM ] && cat $CONFIG_CUSTOM >> $OPENWRT_PATH/.config

          # 执行自定义DIY脚本
          [ -e "$GITHUB_WORKSPACE/$DIY_SCRIPT" ] && \
            chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT" && \
            cd $OPENWRT_PATH && "$GITHUB_WORKSPACE/$DIY_SCRIPT"

          [ -e "$GITHUB_WORKSPACE/$DIY_SCRIPT_2" ] && \
            chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT_2" && \
            cd $OPENWRT_PATH && "$GITHUB_WORKSPACE/$DIY_SCRIPT_2"

          cd $OPENWRT_PATH
          # 容错：检测无clang时自动关闭BPF headers
          if ! command -v clang &> /dev/null; then
            sed -i 's/CONFIG_KERNEL_BPF_HEADERS=y/# CONFIG_KERNEL_BPF_HEADERS is not set/' .config
          fi
          make defconfig

      - name: Download source packages
        run: |
          cd $OPENWRT_PATH
          make download -j8

      - name: Compile firmware (Force BPF_CLANG path, clean old cache first)
        run: |
          cd $OPENWRT_PATH
          echo "Build threads: $(nproc)"
          # 清理报错bpf包与旧staging缓存
          make package/kernel/bpf-headers/clean
          rm -rf staging_dir/host staging_dir/target-*
          # 强制指定clang路径，彻底消除 /invalid/clang
          make BPF_CLANG=/usr/bin/clang -j$(nproc) || make BPF_CLANG=/usr/bin/clang -j1 V=s

      - name: Check disk space
        run: df -hT

      - name: Organize firmware files
        run: |
          cd $OPENWRT_PATH/bin/targets/*/*
          cp $OPENWRT_PATH/.config build.config || true
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

      - name: Upload firmware to Release
        if: env.FIRMWARE_RELEASE == 'true'
        uses: ncipollo/release-action@v1
        with:
          name: ImmortalWrt ${{ env.FIRMWARE_TAG }}
          tag: ${{ env.FIRMWARE_TAG }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.FIRMWARE_PATH }}/*
