name: Build-6.6

on:
  workflow_dispatch:
    inputs:
      clean_toolchain:
        description: '清理缓存工具链'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  schedule:
    - cron: '0 18 */3 * *'

permissions: write-all

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  REPO_BRANCH: mt798x-mt799x-6.6-mtwifi
  CONFIG_BASE: configs/6.6.txt
  CONFIG_CUSTOM: configs/CUSTOMIZE.txt
  DIY_SCRIPT: scripts/diy-script.sh
  DIY_SCRIPT_2: scripts/diy-6.6.sh
  CACHE_TOOLCHAIN: false   # 🔴 关键：关闭缓存避免 /invalid/clang
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: TL-7DR7299-v1
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    # =========================
    # ✅ 统一干净环境（替代 init 脚本）
    # =========================
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang llvm lld \
          flex bison gawk gcc-multilib \
          git curl unzip python3 file rsync \
          libncurses5-dev libncursesw5-dev \
          zlib1g-dev

        clang --version
        llvm-config --version || true

    # =========================
    # Checkout
    # =========================
    - uses: actions/checkout@v5

    - name: Clone source
      run: |
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

    # =========================
    # Feeds
    # =========================
    - name: Update feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # =========================
    # Config
    # =========================
    - name: Load config
      run: |
        [ -e $CONFIG_BASE ] && cat $CONFIG_BASE > $OPENWRT_PATH/.config
        [ -e $CONFIG_CUSTOM ] && cat $CONFIG_CUSTOM >> $OPENWRT_PATH/.config

        [ -e "$GITHUB_WORKSPACE/$DIY_SCRIPT" ] && \
          chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT" && \
          cd $OPENWRT_PATH && "$GITHUB_WORKSPACE/$DIY_SCRIPT"

        [ -e "$GITHUB_WORKSPACE/$DIY_SCRIPT_2" ] && \
          chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT_2" && \
          cd $OPENWRT_PATH && "$GITHUB_WORKSPACE/$DIY_SCRIPT_2"

        cd $OPENWRT_PATH
        make defconfig

    # =========================
    # 🔥 强制修复 clang 环境（关键）
    # =========================
    - name: Fix compiler env
      run: |
        unset CC
        unset CXX
        export CC=clang
        export CXX=clang++

        which clang
        clang --version

    # =========================
    # Download dl
    # =========================
    - name: Download packages
      run: |
        cd $OPENWRT_PATH
        make download -j8

    # =========================
    # Build
    # =========================
    - name: Compile firmware
      run: |
        cd $OPENWRT_PATH
        echo "$(nproc) threads build"
        make -j$(nproc) || make -j1 V=s

    # =========================
    # Space check
    # =========================
    - name: Check space
      run: df -hT

    # =========================
    # Package firmware
    # =========================
    - name: Organize files
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        cp $OPENWRT_PATH/.config build.config || true
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    # =========================
    # Release
    # =========================
    - name: Upload Release
      if: env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: ImmortalWrt ${{ env.FIRMWARE_TAG }}
        tag: ${{ env.FIRMWARE_TAG }}
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
