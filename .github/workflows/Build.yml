name: Build-6.6

on:
  workflow_dispatch:
    inputs:
      clean_toolchain:
        description: '是否清理缓存'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '0 18 */3 * *'

permissions: write-all

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  REPO_BRANCH: mt798x-mt799x-6.6-mtwifi
  CONFIG_BASE: configs/6.6.txt
  CONFIG_CUSTOM: configs/CUSTOMIZE.txt
  DIY_SCRIPT: scripts/diy-script.sh
  DIY_SCRIPT_2: scripts/diy-6.6.sh
  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: TL-7DR7299-v1
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    # =========================
    # 🚀 初始化环境（稳定版）
    # =========================
    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          clang-14 \
          llvm-14 \
          lld-14 \
          libclang-dev \
          llvm-dev \
          build-essential \
          git \
          curl \
          wget \
          unzip \
          file \
          python3 \
          flex \
          bison \
          g++ \
          make \
          gcc \
          dos2unix \
          libfuse-dev

        # ⭐ 固定 clang/llvm 版本
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 100
        sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-14 100

        # ⭐ 清理污染环境（关键）
        unset CC || true
        unset CXX || true
        unset CLANG || true
        unset CFLAGS || true
        unset CXXFLAGS || true

        export CC=clang
        export CXX=clang++

        clang --version || true
        llvm-config --version || true

        sudo timedatectl set-timezone "$TZ" || true

    # =========================
    # 📥 拉源码
    # =========================
    - name: Checkout
      uses: actions/checkout@v5

    - name: Clone Source Code
      run: |
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

        VERSION_INFO=$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")
        echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV

    # =========================
    # 📦 feeds
    # =========================
    - name: Update Feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # =========================
    # ⚙️ config
    # =========================
    - name: Load Config
      run: |
        [ -e $CONFIG_BASE ] && cat $CONFIG_BASE > $OPENWRT_PATH/.config
        [ -e $CONFIG_CUSTOM ] && cat $CONFIG_CUSTOM >> $OPENWRT_PATH/.config

        [ -e "$GITHUB_WORKSPACE/$DIY_SCRIPT" ] && chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT" && cd "$OPENWRT_PATH" && "$GITHUB_WORKSPACE/$DIY_SCRIPT"
        [ -e "$GITHUB_WORKSPACE/$DIY_SCRIPT_2" ] && chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT_2" && cd "$OPENWRT_PATH" && "$GITHUB_WORKSPACE/$DIY_SCRIPT_2"

        cd $OPENWRT_PATH
        make defconfig

    # =========================
    # 🧠 变量
    # =========================
    - name: Generate Variables
      run: |
        cd $OPENWRT_PATH
        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        SOURCE_REPO="${SOURCE_REPO%.git}"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV

    # =========================
    # 📥 dl
    # =========================
    - name: Download DL Package
      run: |
        cd $OPENWRT_PATH
        make download -j8

    # =========================
    # ⚡ 编译（稳定版）
    # =========================
    - name: Compile Firmware
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo "$(nproc) threads build"

        # ❌ 不要任何 CLANG/LLVM 变量
        make -j$(nproc) || make -j1 V=s

        echo "status=success" >> $GITHUB_OUTPUT

        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    # =========================
    # 📦 上传
    # =========================
    - name: Upload Firmware
      if: steps.compile.outputs.status == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin
